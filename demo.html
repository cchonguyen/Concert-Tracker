<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#022c22" />
    <title>LiveArchive · Demo (sample data)</title>
    <script>
      // Apply the saved theme before the app draws (same keys as src/services/theme.ts).
      (function () {
        var mode = 'dark', accent = 'violet';
        try {
          mode = localStorage.getItem('livearchive.themeMode.v1') || mode;
          accent = localStorage.getItem('livearchive.accent.v1') || accent;
        } catch (e) {}
        var light = mode === 'light' || (mode === 'system' && matchMedia('(prefers-color-scheme: light)').matches);
        var root = document.documentElement;
        root.dataset.theme = light ? 'light' : 'dark';
        root.dataset.accent = accent;
        if (light) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#fafafa');
      })();
    </script>
    <meta name="description" content="A demo of LiveArchive with made-up sample data. Nothing here is real." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="__SITE_ORIGIN__/demo" />
    <meta property="og:title" content="LiveArchive" />
    <meta property="og:description" content="Remember every show you went to and everyone you saw there." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/demo/main.tsx"></script>
  </body>
</html>
